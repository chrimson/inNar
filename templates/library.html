<!DOCTYPE html>
<html>
<head>
    <title>Interactive Narrative</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 50px auto;
            max-width: 600px;
            line-height: 1.6;
        }
        .choice-btn { 
            display: inline-block; 
            background: #007bff; color: white; 
            padding: 10px 20px; margin: 10px 5px; 
            text-decoration: none; border-radius: 5px; 
        }
        .choice-btn:hover {
            background: #0056b3;
        }
        .edit-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
        }
        .byline {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Eli's Stories</h1>

    {% for story in stories %}
        <b>{{ story.title }}</b> <i>{{ story.byline }}</i><p>
    {% endfor %}

    <a href="https://limson.care/in/7398">Inner Dimension 7398</a><p>

    <a href="https://limson.care/in/hacker">The Hacker's Hideout</a><p>

    <a href="{{ url_for('create') }}" class="edit-link">Create</a>

</body>
</html>
