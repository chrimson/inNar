<!DOCTYPE html>
<html>
<head>
    <title>Interactive Narrative</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 50px auto;
            max-width: 600px;
            line-height: 1.6;
        }
        .choice-btn { 
            display: inline-block; 
            background: #007bff; color: white; 
            padding: 10px 20px; margin: 10px 5px; 
            text-decoration: none; border-radius: 5px; 
        }
        .choice-btn:hover {
            background: #0056b3;
        }
        .edit-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
        }
        .story {
            text-decoration: none;
            font-weight:: bold;
        }
        .byline {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Limson.Library</h1>

    {% for story in stories %}
        <a href="{{ url_for('story', story_file=story.file) }}" class="story">{{ story.title }}</a>
        <span class="byline">{{ story.byline }}</span><p>
    {% endfor %}

    <a href="{{ url_for('edit_story') }}" class="edit-link">Create</a>
</body>
</html>
