<!DOCTYPE html>
<html>
<head>
    <title>Adventure Game</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; line-height: 1.6; }
        .choice-btn { 
            display: inline-block; 
            background: #007bff; color: white; 
            padding: 10px 20px; margin: 10px 5px; 
            text-decoration: none; border-radius: 5px; 
        }
        .choice-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>The Mystery Forest</h1>
    
    <p>{{ scene['text'] }}</p>

    <div id="choices">
        {% for choice in scene['choices'] %}
            <form action="{{ url_for('game') }}" method="POST" style="display: inline;">
                <input type="hidden" name="node" value="{{ choice['next'] }}">
                <button type="submit" class="choice-btn">
                    {{ choice['text'] }}
                </button>
            </form>
        {% endfor %}
    </div>
</body>
</html>
