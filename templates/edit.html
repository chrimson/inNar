<!DOCTYPE html>
<html>
<head>
    <title>Edit Story</title>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        textarea {
            background-color: #0f0f0f;
            color: #9f9f3f;
            width: 100%;
            height: 500px;
            font-family: monospace;
            padding: 10px;
        }
        .save-btn {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Story Editor</h1>
    <p>Be careful, incorrect format will break the game</p>
    
    <form method="POST">
        <textarea name="story_text">{{ content }}</textarea>
        <br><br>
        <button type="submit" class="save-btn">Save Story</button>
        <a href="{{ url_for('game', story_file=story_file) }}">Cancel</a>
    </form>
</body>
</html>
